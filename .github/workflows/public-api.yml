# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# GitHub recommends pinning actions to a commit SHA.
# To get a newer version, you will need to update the SHA.
# You can also reference a tag or branch, but the action may change without warning.

name: Deploy backend application to Amazon ECS

on:
  workflow_dispatch:

env:
  WORK_DIR: public-api

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Early exit
        if: github.ref != 'refs/heads/main'
        run: |
          gh run cancel ${{ github.run_id }}
          gh run watch ${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 7.4

      - name: Write value to Properties-file
        uses: christian-draeger/write-properties@1.0.1
        with:
          path: "${{ env.WORK_DIR }}/src/main/resources/application.properties"
          property: 'spring.datasource.url'
          value: ${{ vars.DB_URL }}

      - name: Write value to Properties-file
        uses: christian-draeger/write-properties@1.0.1
        with:
          path: "${{ env.WORK_DIR }}/src/main/resources/application.properties"
          property: 'spring.datasource.username'
          value: ${{ vars.DB_USERNAME }}

      - name: Write value to Properties-file
        uses: christian-draeger/write-properties@1.0.1
        with:
          path: "${{ env.WORK_DIR }}/src/main/resources/application.properties"
          property: 'spring.datasource.password'
          value: ${{ secrets.DB_PASSWORD }}

      - name: Write value to Properties-file
        uses: christian-draeger/write-properties@1.0.1
        with:
          path: "${{ env.WORK_DIR }}/src/main/resources/application.properties"
          property: 'spring.datasource.hikari.schema'
          value: ${{ vars.DB_SCHEMA }}

      - name: Write value to Properties-file
        uses: christian-draeger/write-properties@1.0.1
        with:
          path: "${{ env.WORK_DIR }}/src/main/resources/application.properties"
          property: 'aws.access-key'
          value: ${{ vars.AWS_ACCESS_KEY_ID }}

      - name: Write value to Properties-file
        uses: christian-draeger/write-properties@1.0.1
        with:
          path: "${{ env.WORK_DIR }}/src/main/resources/application.properties"
          property: 'aws.access-secret-key'
          value: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Write value to Properties-file
        uses: christian-draeger/write-properties@1.0.1
        with:
          path: "${{ env.WORK_DIR }}/src/main/resources/application.properties"
          property: 'google.oauth2.clientId'
          value: ${{ vars.GOOGLE_OAUTH2_CLIENT_ID }}

      - name: Write value to Properties-file
        uses: christian-draeger/write-properties@1.0.1
        with:
          path: "${{ env.WORK_DIR }}/src/main/resources/application.properties"
          property: 'google.oauth2.clientSecret'
          value: ${{ secrets.GOOGLE_OAUTH2_CLIENT_SECRET }}

      - name: Run build with Gradle Wrapper
        working-directory: ${{ env.WORK_DIR }}
        run: ./gradlew build

      - name: Run build with Gradle Wrapper
        working-directory: ${{ env.WORK_DIR }}
        run: ./gradlew bootJar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        working-directory: ${{ env.WORK_DIR }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Check if Lambda exists
        id: check_lambda
        continue-on-error: true
        env:
          LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
        run: |
          aws lambda get-function --function-name "$LAMBDA_FUNCTION_NAME"

      - name: Create Lambda if missing
        if: steps.check_lambda.outcome == 'failure'
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image }}
          LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          aws lambda create-function \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --package-type Image \
            --code ImageUri="$IMAGE_URI" \
            --role "$AWS_ROLE_ARN" \
            --timeout 900 \
            --memory-size 1024

      - name: Update Lambda function to use new image
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image }}
          LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
        run: |
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --image-uri "$IMAGE_URI"
