name: Deploy backend application

on:
  workflow_dispatch:

env:
  WORK_DIR: public-api

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check if Lambda exists
        id: check_lambda
        continue-on-error: true
        env:
          LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
        run: |
          aws lambda get-function --function-name "$LAMBDA_FUNCTION_NAME"

      - name: Create Lambda if missing
        if: steps.check_lambda.outcome == 'failure'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        working-directory: ${{ env.WORK_DIR }}
        run: |
          aws lambda create-function \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --package-type Image \
            --code ImageUri="$ECR_REGISTRY/$ECR_REPOSITORY:latest-prod" \
            --role "$AWS_ROLE_ARN" \
            --timeout 900 \
            --memory-size 1024

      - name: Update Lambda function to use new image
        env:
          IMAGE_URI: ${{ vars.IMAGE_URI }}
          LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
        run: |
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --image-uri "$ECR_REGISTRY/$ECR_REPOSITORY:latest-prod"
